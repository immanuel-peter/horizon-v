# Step 5 data recipe. Every source, revision, rule, limit, quota and split parameter used by
# `python -m k2hv.data` lives here; the recipe hash is recorded in every build manifest.
# status: include (built and exported), pending (not built until a recorded gap is closed: terms
# evidence or data integrity), exclude (audited and rejected for quality or fit). terms_note records
# the original statement that permits research training use and the media origin; redistribution is
# recorded separately and nothing is redistributed. A dataset creator's own Hub licence declaration
# is a basis; a tag set by someone else (a mirror) or a code-repository licence alone is not.
# Explicit upstream restrictions are recorded; missing upstream terms are recorded as missing.
# Rows inside an included source can be pending too (metadata.pending_reason).

[recipe]
name = "k2hv-step05"
version = "v3"
seed = 20261031
processor = "hf/K2-Horizon-V-init"

[limits]
max_supervised_tokens = 128   # answer + <|ifm|im_end|>
max_total_tokens = 2048       # fully expanded sequence, image pads included
max_image_tokens = 1024       # processor default cap; asserted, never truncated
rl_max_prompt_tokens = 1536   # rendered generation prompt incl. image, leaves room to answer

[rules]
max_question_chars = 1200
max_answer_words = 24
max_answer_sentences = 2
single_line_answer = true

[split]
sft_validation_fraction = 0.01
rl_heldout_fraction = 0.05
sweep_size = 50000
oversample = 1.15

[overlap]
# Stage 1 (all pairs): 64-bit pHash Hamming distance and 32x32 thumbnail correlation.
eval_phash_distance = 10
group_phash_distance = 3
prefilter_similarity = 0.6
# Stage 2 (decoded pairs, aligned 256-px renders): see overlap.aligned_metrics. Calibrated on the
# pilot's inspected pairs: templated charts/maps/forms reach edge 0.95 with max_block >= 0.2;
# recolored or re-encoded copies reach edge >= 0.98 or max_block <= 0.05.
max_aspect_diff = 0.03
confirm_edge = 0.98
confirm_edge_local = 0.93
confirm_max_block = 0.10
uncertain_edge = 0.85          # uncertain matches are excluded and listed for inspection
eval_question_min_chars = 40   # identical question text (after removing format lines) to an eval item is listed
eval_question_specific_chars = 120   # ...and excluded as uncertain when this long,
eval_question_image_similarity = 0.5 # or when the two images are at least loosely similar (32x32 correlation)

[workers]
scan = 14
validate = 15
url_threads = 12

[media.coco_instances_train2017]
# COCO 2017 instance boxes, used to check Nemotron spatial labels against every instance pair.
url = "http://images.cocodataset.org/annotations/annotations_trainval2017.zip"
sha256 = "113a836d90195ee1f884e704da6304dfaaecff1f023f49b6ca93c4aaae470268"
member = "annotations/instances_train2017.json"

