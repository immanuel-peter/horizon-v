[project]
name = "k2-horizon-v"
version = "0.1.0"
description = "Vision adaptation of K2-Horizon-7B with a frozen GLM vision tower"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub",
    "pillow",
    "safetensors",
    "torch",
    "transformers==5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k2hv", "src/k2hv_sglang"]
