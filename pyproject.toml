[project]
name = "k2-horizon-v"
version = "0.1.0"
description = "Vision adaptation of K2-Horizon-7B with a frozen GLM vision tower"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub",
    "pillow",
    "safetensors",
    "torch",
    "transformers==5.19.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/k2hv/hf is a symlink to hf/K2-Horizon-V-init, whose weights are git-ignored by path but would be
# reached through the symlink. Keep them out of every build.
[tool.hatch.build]
exclude = ["*.safetensors", "tokenizer.json", "model.safetensors.index.json", "build_info.json", "SHA256SUMS", ".cache", ".building"]

[tool.hatch.build.targets.wheel]
packages = ["src/k2hv", "src/k2hv_sglang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
